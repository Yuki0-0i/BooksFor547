<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>BooksFor547 · 同人收藏馆</title>
  <meta name="description" content="把散落在 LOFTER、AO3、小红书的喜欢，收进一个只属于你的私人书库。邀请制注册，云端同步。" />
  <meta name="theme-color" content="#fffdfd" />
  <meta property="og:title" content="BooksFor547 · 同人收藏馆" />
  <meta property="og:description" content="把散落在各个平台的喜欢，悄悄珍藏起来。" />
  <meta property="og:type" content="website" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%B7%3C/text%3E%3C/svg%3E" />
  <style>
    :root {
      color-scheme: light;
      --ink: #3a2f38;
      --ink-soft: #6f6270;
      --ink-dim: #978c9a;
      --accent: #c85787;
      --accent-deep: #a63a66;
      --line: #f2e1ea;
      --card: #ffffff;
      --bg1: #fff8fb;
      --bg2: #f7f4fb;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 18px;
      color: var(--ink);
      background:
        radial-gradient(900px 520px at 12% -12%, rgba(236, 130, 169, 0.16), transparent 62%),
        radial-gradient(760px 460px at 92% 8%, rgba(147, 130, 214, 0.14), transparent 58%),
        linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 100%);
      font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .wrap { width: 100%; max-width: 560px; }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 38px 34px 32px;
      box-shadow: 0 18px 48px rgba(126, 72, 104, 0.10);
      text-align: center;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 14px;
      border-radius: 999px;
      background: #fff2f7;
      border: 1px solid #f4d8e5;
      color: var(--accent-deep);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 16px 0 6px;
      font-size: clamp(30px, 7vw, 42px);
      line-height: 1.18;
      letter-spacing: -0.02em;
      font-weight: 800;
      color: #402f3b;
    }

    .sub {
      margin: 0 0 18px;
      font-size: 13px;
      letter-spacing: 0.28em;
      color: var(--ink-dim);
      text-transform: uppercase;
    }

    .desc {
      margin: 0 auto 26px;
      max-width: 420px;
      font-size: 15px;
      line-height: 1.85;
      color: var(--ink-soft);
    }

    .cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      max-width: 340px;
      padding: 15px 26px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--accent), var(--accent-deep));
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 10px 24px rgba(168, 58, 102, 0.28);
      transition: transform 0.16s ease, box-shadow 0.16s ease;
    }

    .cta:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(168, 58, 102, 0.34);
    }

    .cta:active { transform: translateY(0); }

    .cta span.arrow { font-size: 18px; line-height: 1; }

    .hint {
      margin: 14px 0 0;
      font-size: 12.5px;
      line-height: 1.7;
      color: var(--ink-dim);
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin: 26px 0 0;
      padding-top: 22px;
      border-top: 1px solid #f7eaf1;
    }

    .chip {
      padding: 7px 14px;
      border-radius: 999px;
      background: #fff8fb;
      border: 1px solid #f5e2ec;
      color: #8c5878;
      font-size: 12.5px;
      font-weight: 600;
      white-space: nowrap;
    }

    footer {
      margin-top: 22px;
      text-align: center;
      font-size: 11.5px;
      color: #a99ba6;
      line-height: 1.7;
    }

    @media (max-width: 420px) {
      body { padding: 20px 14px; }
      .card { padding: 28px 20px 24px; border-radius: 20px; }
      h1 { margin-top: 12px; }
      .desc { font-size: 14px; margin-bottom: 22px; }
      .cta { padding: 14px 18px; font-size: 15px; }
      .chips { margin-top: 22px; padding-top: 18px; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <span class="badge">🌷 FANDOM ARCHIVE</span>
      <h1>BooksFor547</h1>
      <p class="sub">My Little Library</p>
      <p class="desc">
        把散落在 LOFTER、AO3、小红书的喜欢，<br />
        收进一个只属于你的私人书库。
      </p>

      <a class="cta" href="https://booksfor547.streamlit.app/" target="_blank" rel="noopener noreferrer">
        进入收藏馆 <span class="arrow">→</span>
      </a>

      <p class="hint">
        注册需要邀请码，请向管理员索取。<br />
        已有账号可直接登录。
      </p>

      <div class="chips">
        <span class="chip">📚 个人书库</span>
        <span class="chip">💌 邀请制</span>
        <span class="chip">☁️ 云端同步</span>
        <span class="chip">🛠️ 管理后台</span>
      </div>
    </section>

    <footer>
      © 2026 BooksFor547 · 私人同人收藏馆<br />
      数据仅你可见，请勿分享账号
    </footer>
  </main>
</body>
</html>
